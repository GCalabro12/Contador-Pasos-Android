<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pasos</title>
<style>
  body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; box-sizing: border-box; }
  .n { font-size: 4.5rem; font-weight: 800; color: #fff; }
  .l { color: #94a3b8; margin-bottom: 30px; }
  p { color: #94a3b8; font-size: 0.9rem; line-height: 1.5; max-width: 320px; }
  button { background: #16a34a; color: #fff; border: 0; border-radius: 0.7rem; padding: 0.9rem 1.4rem; font-size: 1rem; font-weight: 700; margin-top: 16px; }
</style>
</head>
<body>
  <div>👣</div>
  <div class="n" id="n">0</div>
  <div class="l">pasos hoy</div>
  <p>Sin conexión a internet. Los pasos se siguen contando igual; la música y el resto de la app vuelven cuando haya conexión.</p>
  <button onclick="location.href='https://gcalabro12.github.io/Contador-Pasos/'">↻ Reintentar</button>
<script>
  function pintar() {
    try { document.getElementById('n').textContent = JSON.parse(AndroidPasos.getToday()).steps.toLocaleString('es-ES'); } catch (e) {}
  }
  pintar(); setInterval(pintar, 2000);
</script>
</body>
</html>
